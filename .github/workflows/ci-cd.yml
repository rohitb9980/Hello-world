name: nodejs-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  APP_NAME: hello-node-app
  IMAGE_NAME: hello-node-app
  IMAGE_TAG: ${{ github.sha }}
  K8S_CLUSTER_NAME: demo-cluster

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build step
        run: echo "No build needed for simple Node.js app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app-source
          path: |
            app.js
            package.json
            package-lock.json
            Dockerfile
            k8s/

  unit_test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  upload_artifact:
    name: Upload Artifact
    runs-on: ubuntu-latest
    needs: [build, unit_test]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app-source
          path: .

      - name: Archive app
        run: tar -czf hello-node-app.tar.gz app.js package.json package-lock.json Dockerfile k8s

      - name: Upload archived artifact
        uses: actions/upload-artifact@v4
        with:
          name: archived-app
          path: hello-node-app.tar.gz

  docker_build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: upload_artifact
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .

      - name: Save image
        run: docker save ${IMAGE_NAME}:${IMAGE_TAG} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker_build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .

      - name: Install kind
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.26.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Create kind cluster
        run: kind create cluster --name ${K8S_CLUSTER_NAME}

      - name: Load Docker image into kind
        run: |
          docker load -i image.tar
          kind load docker-image ${IMAGE_NAME}:${IMAGE_TAG} --name ${K8S_CLUSTER_NAME}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl set image deployment/hello-node-app hello-node-app=${IMAGE_NAME}:${IMAGE_TAG}
          kubectl rollout status deployment/hello-node-app --timeout=120s

      - name: Verify deployment
        run: kubectl get pods,svc